name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To read the catalog artifact that "Build pre-fetched histories" left behind.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build the static site
    runs-on: ubuntu-latest
    # Two full builds, a browser smoke test, and several hundred megabytes of
    # catalog to pull down and copy into dist.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/catalog-release.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test a root-path build
        # The browser tests address the site at "/", so they run against a
        # default build; the Pages build follows once they pass.
        run: |
          npm run build
          npx playwright test tests/e2e/demo.spec.ts --grep "pressing Play"
        env:
          CI: 'true'
      - name: Fetch the soundtrack
        # Freely licensed instrumental music, Creative Commons Attribution 4.0.
        # Fetched rather than committed: twenty megabytes of audio does not
        # belong in a git history. Best effort — a build without music is
        # quiet, not broken.
        continue-on-error: true
        run: node scripts/build-music.mjs public/music

      - name: Collect the pre-fetched catalog
        if: ${{ vars.VITE_CATALOG_BASE == '' }}
        # GitHub gives an anonymous visitor about 60 requests an hour, and a
        # large repository needs thousands. The answer is not to ship a token —
        # a browser has to send it as an Authorization header, so anyone can
        # read it straight out of the network tab — but to do the work once,
        # ahead of time, and publish the *result* as a static file.
        #
        # That work happens in `datasets.yml`, not here. It clones each showcase
        # repository with `--filter=tree:0` and compiles its performance, which
        # takes hours and needs a runner per repository; a deploy cannot wait for
        # that and must not repeat it. So this reaches for what the most recent
        # successful run of that workflow left behind and publishes it.
        #
        # Best effort on purpose. A repository with no catalog built yet, or an
        # artifact that has aged out, must not fail a deploy: the shelf simply
        # does not appear in that build, and `tests/e2e/catalog.spec.ts` skips
        # itself rather than failing when there is no shelf to click.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow datasets.yml \
                  --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN" ]; then
            echo "::warning::No successful run of datasets.yml yet — this build ships without a catalog."
            exit 0
          fi
          echo "taking the catalog from datasets.yml run $RUN"
          mkdir -p public/catalog
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name catalog --dir public/catalog
          ls -la public/catalog/
          du -sh public/catalog

      - name: Build with the Pages base path
        # Project sites live under /<repository>/; a user or organization site
        # (<owner>.github.io) lives at /.
        env:
          # Through the environment rather than interpolated into the script:
          # a `${{ }}` inside a shell block is textual substitution, which is
          # the shape every Actions script-injection advisory has.
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_CATALOG_BASE: ${{ vars.VITE_CATALOG_BASE }}
          # Vite inlines `import.meta.env.VITE_*` at build time — it is a text
          # substitution, not a lookup — so a variable set in the repository
          # settings and never named here does not reach the bundle. That is
          # exactly why sign-in has been dead on every deployment: the app read
          # `VITE_AUTH_BASE`, the variable existed, and no build ever saw it.
          # Empty is a valid value for both: analytics loads no script and asks
          # nothing, and the sign-in button says it is not configured.
          VITE_AUTH_BASE: ${{ vars.VITE_AUTH_BASE }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then VITE_BASE="/"; else VITE_BASE="/$REPO_NAME/"; fi
          export VITE_BASE
          echo "Building with VITE_BASE=$VITE_BASE"
          npm run build
      - name: Verify the remote catalog release
        if: ${{ vars.VITE_CATALOG_BASE != '' }}
        env:
          VITE_CATALOG_BASE: ${{ vars.VITE_CATALOG_BASE }}
        run: node scripts/check-remote-catalog.mjs
      - name: SPA-friendly 404 (static hosting has no server routing)
        run: cp dist/index.html dist/404.html

      - name: Drop the catalog files nothing can ask for
        if: ${{ vars.VITE_CATALOG_BASE == '' }}
        # An entry that ships a compiled plan is played from the plan; its
        # dataset is then read for one purpose only, filling commit subjects
        # back into the ledger — and that fill-in is refused above
        # HYDRATE_MAX_BYTES, because it is one synchronous pass that would
        # freeze the stage mid-performance. Every dataset above that limit is
        # therefore published and never fetched by anybody.
        #
        # Measured on the current shelf that is 636 MB of 945 MB, which is not
        # merely idle: it is most of the distance to the ceiling checked below.
        #
        # Only `dist` is pruned. The datasets stay where they are built,
        # because they are what a plan is recompiled from when the choreography
        # changes, and re-cloning Chromium to get one back is an hour nobody
        # should spend.
        run: node scripts/prune-catalog.mjs --dir dist/catalog --apply

      - name: Check the site against the Pages size limit
        # A published GitHub Pages site may be no larger than 1 GB, and the
        # catalog is nearly all of what this one weighs: measured on a full
        # shelf, the twelve histories and their twelve compiled plans come to
        # 982 MB and dist to 1,014 MB. That is close enough to the ceiling that
        # the next repository added to the shelf goes over it.
        #
        # Past the limit the deploy fails at the very end with nothing useful to
        # say, so the number and the breakdown behind it are printed here. The
        # hard stop uses decimal GB conservatively. A remote-catalog build
        # excludes public/catalog entirely, independent of its working size.
        run: |
          BYTES=$(du -sb dist | cut -f1)
          echo "dist is $((BYTES / 1000000)) MB"
          du -h dist/catalog/* 2>/dev/null | sort -h | tail -25 || true
          if [ "$BYTES" -gt 1000000000 ]; then
            echo "::error::dist is $((BYTES / 1000000)) MB and GitHub Pages will not publish a site over 1 GB. Drop the largest entries from SHIPPED in scripts/index-artifacts.mjs and from the matrix in datasets.yml, or host the catalog somewhere with room for it."
            exit 1
          fi
          if [ "$BYTES" -gt 900000000 ]; then
            echo "::warning::dist is $((BYTES / 1000000)) MB, against a documented Pages ceiling of 1 GB. Chromium and Linux are 610 MB of that between their histories and their plans. The next entry added to the shelf will not fit."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
