<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Paste a public GitHub repository URL and watch its real Git history become a deterministic, rhythm-driven choreography of commits, parallel work, contributors and merges." />
    <!--
      The policy is the site's promise written somewhere a browser enforces it:
      repository data is read from api.github.com and drawn here, and there is
      nowhere else for it to go.

      Analytics widens that by exactly four hosts, and each one is here because
      gtag.js does not work without it:

        script-src   www.googletagmanager.com   gtag.js itself. Loaded by `src`
                     from app/analytics.ts rather than from Google's inline
                     snippet, so no 'unsafe-inline' is needed.
        connect-src  *.google-analytics.com     /g/collect, from whichever
                     region the visitor is measured in.
                     *.analytics.google.com     the consent and configuration
                     pings gtag.js makes alongside it.
                     www.googletagmanager.com   gtag.js re-reads its own
                     configuration from the host it was loaded from.
        img-src      *.google-analytics.com     the beacon it falls back to
                     where fetch and sendBeacon are unavailable.

      All four are inert unless VITE_GA_ID is set: with no measurement id
      nothing is loaded and nothing is sent. What may be sent when it is set is
      decided in src/app/analytics.ts, not here — a connect-src entry says
      where a request may go, never what it is allowed to carry.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com; media-src 'self' blob:; connect-src 'self' https://api.github.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>GitTimeline — history performs itself</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2307080c'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%23f4e9d2'/%3E%3Ccircle cx='22' cy='11' r='2.4' fill='%237fd6ff'/%3E%3Ccircle cx='22' cy='21' r='2.4' fill='%23ffb070'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
