version: 2
# Kept quiet on purpose: one check a month, every minor and patch update in one pull request per
# ecosystem, and at most two open at a time, so updates don't arrive as a stream of pull requests
# and emails. Major updates still come one at a time, since they are the ones that need a look.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint (8.74) supports TypeScript below 6.1 only, so a TypeScript major fails
      # `npm ci` with ERESOLVE. Drop this once typescript-eslint's peer range includes the next major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
