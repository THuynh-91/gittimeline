name: CI

on:
  pull_request:
  push:
    # Every branch, main included.
    #
    # This was `branches-ignore: [main, master]`, on the reasoning that a push
    # to main runs the deploy workflow and its verify job covers the same
    # ground. It does not: deploy's verify runs lint, typecheck, `npm test` and
    # a single grepped Chromium test, so nothing on main ever ran the Firefox
    # or WebKit suites, and a WebKit-only defect could reach the live site with
    # a green tick beside it. That is not hypothetical -- WebKit does not
    # implement canvas `ctx.filter`, and the bloom rewrite cost it 11% before
    # anyone measured it.
    #
    # It also means a direct push to main, which is how this repository is
    # actually worked on, had no gate at all.
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build, browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The sign-in Worker, whose suite is not reachable from the root config.
      #
      # `worker/` has its own `vitest.config.mjs`, so the root `npm test` never
      # saw it and these twenty-seven tests ran only when somebody remembered
      # to run them by hand. They cover the one control that stops the Worker
      # minting a token into a site that is not this one: `ALLOWED_ORIGINS`,
      # which has to match on path as well as origin because
      # `thuynh-91.github.io` is a GitHub Pages *user* origin serving every
      # project on the account. A review has already demonstrated that guard
      # accepting a neighbouring site when it was origin-only. That is not a
      # thing to leave to memory.
      #
      # No install step: `worker/package.json` lists only wrangler, which the
      # tests do not use, and vitest resolves from the root tree by Node's
      # parent lookup. Verified by deleting `worker/node_modules` entirely and
      # running this — twenty-seven passed. So it depends on the root `npm ci`
      # above having run, which in this job it has.
      - name: Sign-in Worker tests
        working-directory: worker
        run: npm test
      - run: npm run build
      # All three engines, because the config asks for all three.
      #
      # This installed chromium only while `npm run test:e2e` runs the
      # chromium, firefox and webkit projects, so every Firefox and WebKit test
      # failed in three or four milliseconds on a missing executable. The
      # cross-engine coverage this repository believes it has has never once
      # run. Checked on run 34275999716: 100-odd instant failures, all of them
      # firefox or webkit.
      #
      # Two engines' worth of extra install time is the price of the two
      # engines' worth of coverage, and WebKit is Safari and every browser on
      # iOS, which is not a rounding error in an audience.
      - name: Install Playwright browsers
        # `--with-deps` runs `apt-get`, and a package-mirror hiccup on the
        # runner should not be able to block a deploy. On 2026-09-09 it did:
        # two consecutive runs failed with "Some index files failed to
        # download" and a hash mismatch on the Ubuntu index, exiting 100
        # before a single test ran, and the live site went stale behind it.
        #
        # The fallback installs the browser without touching apt. GitHub's
        # ubuntu-latest image already carries Playwright's system libraries,
        # so this normally changes nothing -- and if a library really is
        # missing the browser fails to launch and the tests say so, which is a
        # loud failure rather than a silent one.
        run: npx playwright install --with-deps || npx playwright install
      - name: Browser tests against the built output
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
