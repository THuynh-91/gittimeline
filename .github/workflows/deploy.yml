name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test a root-path build
        # The browser tests address the site at "/", so they run against a
        # default build; the Pages build follows once they pass.
        run: |
          npm run build
          npx playwright test tests/e2e/demo.spec.ts --grep "pressing Play"
        env:
          CI: 'true'
      - name: Build the pre-fetched catalog
        # GitHub gives an anonymous visitor about 60 requests an hour, and a
        # large repository needs hundreds. Shipping a token would not fix that:
        # the browser has to send it as an Authorization header, so anyone can
        # read it out of the network tab. Instead the fetching happens here,
        # once, with the token Actions issues to this job and which never
        # leaves it, and the *result* is published as a static file.
        #
        # Best effort on purpose. A rate limit or a renamed repository must not
        # fail a deploy: the shelf simply does not appear in that build.
        continue-on-error: true
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/build-catalog.mjs public/catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build with the Pages base path
        # Project sites live under /<repository>/; a user or organization site
        # (<owner>.github.io) lives at /.
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then export VITE_BASE="/"; else export VITE_BASE="/${{ github.event.repository.name }}/"; fi
          echo "Building with VITE_BASE=$VITE_BASE"
          npm run build
      - name: SPA-friendly 404 (static hosting has no server routing)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
